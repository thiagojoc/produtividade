name: Verifica tarefas e notifica

# Roda a cada 10 minutos, mesmo com ninguém com o app aberto em lugar
# nenhum (computador desligado, celular sem o navegador aberto etc.). É
# esse agendamento que garante o aviso mesmo "com o computador desligado".
# O GitHub Actions não garante pontualidade exata em repositórios pouco
# movimentados, então pode atrasar alguns minutos vez ou outra.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'teste_push manda uma notificação agora pra todo mundo que já ativou, sem checar tarefa nenhuma (só pra confirmar que a entrega funciona com o app fechado)'
        type: choice
        default: normal
        options:
          - normal
          - teste_push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instala dependências
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Verifica tarefas vencendo/atrasando e notifica
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_PUSH: ${{ github.event.inputs.modo == 'teste_push' && 'true' || 'false' }}
        run: node check-and-notify.mjs
